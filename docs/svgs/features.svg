<!-- Desktop layout - Two columns -->
<svg fill="none" viewBox="0 0 1200 270" width="100%" height="340" xmlns="http://www.w3.org/2000/svg">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
                .container {
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 20px;
                    padding: 20px;
                }
                .alert-box {
                    border-left: 4px solid #1f883d;
                    padding: 12px;
                    margin-bottom: 16px;
                    border-radius: 6px;
                    background: rgba(31, 136, 61, 0.1);
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                    width: 100%;
                    box-sizing: border-box;
                }
                .alert-title {
                    margin: 0 0 8px 0;
                    font-weight: 600;
                }
                .alert-content {
                    margin: 0;
                    line-height: 1.5;
                }

                /* Light mode */
                    @media (prefers-color-scheme: light) {
                    .alert-title { color: #000000; }
                    .alert-content { color: #333333; }
                    .alert-box { background: rgba(31, 136, 61, 0.1); }
                }

                /* Dark mode */
                @media (prefers-color-scheme: dark) {
                    .alert-title { color: #ffffff; }
                    .alert-content { color: #ffffff; }
                    .alert-box { background: rgba(31, 136, 61, 0.2); }
                }
            </style>
            <div class="container">
                <div class="alert-box">
                    <p class="alert-title"><strong>HasAttributes</strong></p>
                    <p class="alert-content">Immutable HTML attribute management with enum keys/values, closure support, and array merging</p>
                </div>
                <div class="alert-box">
                    <p class="alert-title"><strong>HasContent</strong></p>
                    <p class="alert-content">Safe content encoding for XSS protection via <code>content()</code> and raw HTML insertion via <code>html()</code></p>
                </div>
                <div class="alert-box">
                    <p class="alert-title"><strong>HasTemplate</strong></p>
                    <p class="alert-content">Custom template strings for flexible tag construction with immutable template management</p>
                </div>
                <div class="alert-box">
                    <p class="alert-title"><strong>HasPrefix/SuffixCollection</strong></p>
                    <p class="alert-content">Render content before/after elements with optional UnitEnum tag wrapping and independent attribute management</p>
                </div>
            </div>
        </div>
    </foreignObject>
</svg>
