<!-- Mobile version - Single column -->
<svg viewBox="0 0 620 620" width="100%" height="580" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 14px; fill: #1a202c; }
        .content { font-size: 11px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="16" y="16" width="588" height="84" rx="6"/>
        <rect x="16" y="16" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="42">Attribute Management</text>
        <text class="content" x="32" y="66">Immutable addAttribute(), attributes(), getAttribute() and removal APIs</text>
        <text class="content" x="32" y="84">Prefix-aware keys &#8226; UnitEnum support &#8226; null values remove safely</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="116" width="588" height="84" rx="6"/>
        <rect x="16" y="116" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="142">Container Collection</text>
        <text class="content" x="32" y="166">Toggle container rendering and manage container attributes immutably</text>
        <text class="content" x="32" y="184">Class merging, attribute replacement and prefix-aware removal</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="216" width="588" height="84" rx="6"/>
        <rect x="16" y="216" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="242">Content Encoding</text>
        <text class="content" x="32" y="266">Encoded content() values for safe output with Stringable support</text>
        <text class="content" x="32" y="284">Explicit html() insertion for trusted raw markup</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="316" width="588" height="84" rx="6"/>
        <rect x="16" y="316" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="342">Label Collection</text>
        <text class="content" x="32" y="366">Immutable label content, visibility state and label attributes</text>
        <text class="content" x="32" y="384">Prefix-aware lookups for accessible component labels</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="416" width="588" height="84" rx="6"/>
        <rect x="16" y="416" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="442">Prefix &amp; Suffix Collections</text>
        <text class="content" x="32" y="466">Render content before and after elements with optional UnitEnum tags</text>
        <text class="content" x="32" y="484">Independent attributes, class merging and tag control</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="516" width="588" height="84" rx="6"/>
        <rect x="16" y="516" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="542">Template Strings</text>
        <text class="content" x="32" y="566">Immutable template assignment for reusable component rendering</text>
        <text class="content" x="32" y="584">Small mixin primitives with no framework coupling</text>
    </g>
</svg>
